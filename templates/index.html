<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音视频 → OSS 转存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #f2f2f7;
    --panel-bg: #ffffff;
    --border: #e8e8f0;
    --border-light: #f0f0f5;
    --pink: #fe2c55;
    --pink-soft: rgba(254,44,85,0.08);
    --cyan: #0098ae;
    --cyan-soft: rgba(0,152,174,0.08);
    --green: #00b368;
    --green-soft: rgba(0,179,104,0.1);
    --amber: #c78400;
    --amber-soft: rgba(199,132,0,0.08);
    --text: #14141c;
    --text-secondary: #5e5e6e;
    --text-muted: #9a9aac;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 4px rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 8px rgba(0,0,0,0.04), 0 16px 40px rgba(0,0,0,0.08);
    --font-display: "Saira Semi Condensed", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "Share Tech Mono", "SF Mono", "Consolas", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-display);
    background: var(--page-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse 700px 500px at 10% 5%, rgba(254,44,85,0.03) 0%, transparent 70%),
      radial-gradient(ellipse 500px 400px at 85% 80%, rgba(0,152,174,0.03) 0%, transparent 70%);
    background-attachment: fixed;
  }

  /* ── Console shell ── */
  .console {
    display: flex;
    height: 100vh;
    padding: 20px;
    gap: 20px;
  }

  /* ── CONTROL PANEL (left) ── */
  .control {
    width: 392px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }

  /* Brand header */
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-mark {
    width: 46px; height: 46px;
    background: linear-gradient(135deg, var(--pink), #ff5680);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(254,44,85,0.2);
  }
  .brand h1 {
    font-size: 22px; font-weight: 800;
    letter-spacing: 0.02em; color: var(--text);
    line-height: 1.2;
  }
  .brand .tagline {
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 600;
  }

  /* Input area */
  .input-area { display: flex; flex-direction: column; gap: 10px; }
  .input-area label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
  }
  .url-input {
    width: 100%;
    padding: 14px 16px;
    background: #f8f8fc;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px; color: var(--text);
    font-family: var(--font-mono);
    outline: none;
    transition: all 0.25s ease;
  }
  .url-input::placeholder { color: #c0c0d0; font-family: var(--font-display); }
  .url-input:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 4px var(--pink-soft);
    background: #fff;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--pink), #e01842);
    color: #fff; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    font-family: var(--font-display);
    letter-spacing: 0.04em;
    box-shadow: 0 2px 12px rgba(254,44,85,0.22);
    transition: all 0.25s ease;
  }
  .btn-submit:hover {
    box-shadow: 0 4px 20px rgba(254,44,85,0.32);
    transform: translateY(-1px);
  }
  .btn-submit:active { transform: scale(0.97); }
  .btn-submit:disabled {
    background: #dcdce4;
    color: #b0b0be;
    box-shadow: none; cursor: not-allowed; transform: none;
  }

  /* Progress section */
  .progress-section { }
  .progress-label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
    margin-bottom: 14px;
  }
  .progress-steps {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }
  .progress-steps::before {
    content: "";
    position: absolute; top: 11px; left: 16px; right: 16px;
    height: 2px;
    background: #ececf2;
    border-radius: 1px;
    z-index: 0;
  }
  .progress-track-fill {
    position: absolute; top: 11px; left: 16px;
    height: 2px;
    background: var(--green);
    border-radius: 1px;
    z-index: 1;
    transition: width 0.5s ease;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 2;
    position: relative;
  }
  .step-dot {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #d4d4de;
    transition: all 0.4s ease;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: transparent; font-weight: 700;
  }
  .step-dot.active {
    border-color: var(--cyan);
    background: var(--cyan-soft);
    color: var(--cyan);
    box-shadow: 0 0 0 4px var(--cyan-soft);
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  .step-dot.done {
    border-color: var(--green);
    background: var(--green-soft);
    color: var(--green);
  }
  .step-dot.error {
    border-color: var(--pink);
    background: var(--pink-soft);
    color: var(--pink);
  }
  @keyframes dotPulse {
    0%,100% { box-shadow: 0 0 0 4px var(--cyan-soft); }
    50% { box-shadow: 0 0 0 10px rgba(0,152,174,0.04); }
  }
  .step-label {
    font-size: 10px; color: var(--text-muted);
    letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 700;
    transition: color 0.4s ease;
  }
  .step-label.active { color: var(--cyan); }
  .step-label.done { color: var(--green); }
  .step-label.error { color: var(--pink); }

  .status-msg {
    margin-top: 14px;
    min-height: 20px;
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 0.03em;
    font-family: var(--font-mono);
  }
  .status-msg.error { color: var(--pink); }

  /* Bottom actions */
  .control-footer {
    margin-top: auto;
    display: flex;
    gap: 10px;
  }
  .btn-ghost {
    flex: 1;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-secondary);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    font-family: var(--font-display);
    letter-spacing: 0.03em;
    transition: all 0.2s ease;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .btn-ghost:hover {
    border-color: #c8c8d4;
    color: var(--text);
    box-shadow: var(--shadow-md);
  }

  /* ── MONITOR (right) ── */
  .monitor {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    min-width: 0;
    min-height: 0;
  }

  .monitor-panel {
    flex: 1;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    min-height: 300px;
    flex-direction: column;
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    pointer-events: none;
    flex: 1;
    justify-content: center;
  }
  .empty-illustration {
    width: 100px; height: 100px;
    border-radius: 24px;
    background: #f6f6fb;
    border: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    box-shadow: var(--shadow-sm);
  }
  .empty-text {
    font-size: 14px; color: var(--text-muted);
    letter-spacing: 0.04em; font-weight: 600;
  }
  /* Waveform */
  .waveform {
    display: flex; align-items: flex-end; gap: 3px; height: 32px;
  }
  .waveform .bar {
    width: 3px;
    background: #d8d8e4;
    border-radius: 2px;
    animation: wave 1.4s ease-in-out infinite;
  }
  .waveform .bar:nth-child(1) { height: 12px; animation-delay: 0s; }
  .waveform .bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
  .waveform .bar:nth-child(3) { height: 15px; animation-delay: 0.2s; }
  .waveform .bar:nth-child(4) { height: 28px; animation-delay: 0.3s; }
  .waveform .bar:nth-child(5) { height: 18px; animation-delay: 0.4s; }
  .waveform .bar:nth-child(6) { height: 24px; animation-delay: 0.5s; }
  .waveform .bar:nth-child(7) { height: 14px; animation-delay: 0.6s; }
  .waveform .bar:nth-child(8) { height: 26px; animation-delay: 0.7s; }
  .waveform .bar:nth-child(9) { height: 16px; animation-delay: 0.8s; }
  .waveform .bar:nth-child(10){ height: 22px; animation-delay: 0.9s; }
  .waveform .bar:nth-child(11){ height: 10px; animation-delay: 1.0s; }
  .waveform .bar:nth-child(12){ height: 28px; animation-delay: 1.1s; }
  @keyframes wave {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(0.35); }
  }

  /* Result content */
  .result-content {
    display: none;
    width: 100%; height: 100%;
    flex-direction: column;
  }
  .result-content.show {
    display: flex;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .video-wrapper {
    flex: 1;
    background: #0a0a0f;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
    position: relative;
  }
  .video-wrapper video {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  .video-wrapper::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px
    );
  }

  /* Info bar */
  .info-bar {
    background: #fafaff;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
  }
  .info-bar .vid-title {
    font-weight: 700; font-size: 14px; color: var(--text);
    letter-spacing: 0.02em;
    flex: 1; min-width: 120px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .info-bar .url-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    background: #f3f3f8;
    padding: 7px 16px; border-radius: 20px;
    border: 1px solid var(--border-light);
    max-width: 280px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .info-bar .url-pill:hover {
    background: #eeeef5;
    color: var(--text);
  }
  .info-bar .btn-download {
    padding: 10px 24px;
    font-size: 13px; font-weight: 700;
    background: linear-gradient(135deg, var(--green), #009e56);
    color: #fff; border: none; border-radius: 10px;
    cursor: pointer;
    font-family: var(--font-display);
    letter-spacing: 0.04em;
    box-shadow: 0 2px 10px rgba(0,179,104,0.2);
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .info-bar .btn-download:hover {
    box-shadow: 0 4px 18px rgba(0,179,104,0.3);
    transform: translateY(-1px);
  }
  .info-bar .btn-download:active { transform: scale(0.97); }

  .info-bar .btn-sm {
    padding: 8px 16px;
    font-size: 11px; font-weight: 600;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font-display);
    letter-spacing: 0.04em;
    transition: all 0.2s ease;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }
  .info-bar .btn-sm:hover {
    border-color: #c8c8d4;
    color: var(--text);
  }

  /* OSS note badge */
  .oss-badge {
    display: none;
    font-size: 12px; color: var(--amber);
    background: var(--amber-soft);
    border: 1px solid rgba(199,132,0,0.15);
    padding: 10px 18px; border-radius: 8px;
    letter-spacing: 0.03em;
    font-weight: 600;
  }
  .oss-badge.show { display: block; }

  /* Toast */
  .toast {
    position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
    background: #fff;
    color: var(--text); padding: 12px 28px;
    border-radius: 24px; font-size: 13px; z-index: 9999;
    pointer-events: none;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    letter-spacing: 0.03em; font-family: var(--font-display);
    font-weight: 600;
    animation: toastAnim 2.2s ease forwards;
  }
  @keyframes toastAnim {
    0%   { opacity: 0; transform: translateX(-50%) translateY(12px); }
    12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    78%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d4d4dc; border-radius: 3px; }
  ::selection { background: rgba(254,44,85,0.15); color: var(--text); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .console {
      flex-direction: column;
      height: auto;
      padding: 12px;
      gap: 12px;
    }
    .control {
      width: 100%;
      flex-shrink: 1;
    }
    .monitor {
      min-height: 400px;
    }
    .monitor-panel {
      min-height: 300px;
    }
    .info-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .info-bar .url-pill {
      max-width: 100%;
    }
  }
</style>
</head>
<body>

<div class="console">
  <!-- ═══ CONTROL PANEL ═══ -->
  <aside class="control">
    <div class="panel">
      <div class="brand">
        <div class="brand-mark">▶</div>
        <div>
          <h1>抖音视频转存</h1>
          <div class="tagline">Download &amp; Upload to OSS</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="input-area">
        <label>视频链接</label>
        <input
          type="text"
          class="url-input"
          id="urlInput"
          placeholder="粘贴抖音分享链接..."
          autocomplete="off"
        />
        <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">
          开始上传
        </button>
      </div>
    </div>

    <div class="panel">
      <div class="progress-section">
        <div class="progress-label">处理进度</div>
        <div class="progress-steps">
          <div class="progress-track-fill" id="progressFill" style="width:0%"></div>
          <div class="step" id="stepParse">
            <div class="step-dot">1</div>
            <span class="step-label">解析</span>
          </div>
          <div class="step" id="stepDownload">
            <div class="step-dot">2</div>
            <span class="step-label">下载</span>
          </div>
          <div class="step" id="stepUpload">
            <div class="step-dot">3</div>
            <span class="step-label">上传</span>
          </div>
        </div>
        <div class="status-msg" id="statusMsg">等待输入链接...</div>
      </div>
    </div>

    <div class="control-footer">
      <button class="btn-ghost" onclick="continueUpload()">继续上传</button>
      <button class="btn-ghost" onclick="refreshPage()">刷新页面</button>
    </div>
  </aside>

  <!-- ═══ MONITOR ═══ -->
  <main class="monitor">
    <div class="monitor-panel" id="monitorPanel">
      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-illustration">📹</div>
        <div class="waveform">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="empty-text">等待视频链接...</div>
      </div>

      <!-- Result -->
      <div class="result-content" id="resultContent">
        <div class="video-wrapper">
          <video id="videoPlayer" controls playsinline></video>
        </div>
        <div class="oss-badge" id="ossBadge">OSS 未配置 — 视频已保存至本地</div>
        <div class="info-bar">
          <span class="vid-title" id="videoTitle">—</span>
          <span class="url-pill" id="ossUrlPill" title="点击复制" onclick="copyUrl()">—</span>
          <button class="btn-download" id="btnDownload" onclick="downloadVideo()">下载</button>
          <button class="btn-sm" onclick="copyDownloadUrl()">复制链接</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const urlInput = document.getElementById("urlInput");
const submitBtn = document.getElementById("submitBtn");
const emptyState = document.getElementById("emptyState");
const resultContent = document.getElementById("resultContent");
const videoPlayer = document.getElementById("videoPlayer");
const videoTitle = document.getElementById("videoTitle");
const ossUrlPill = document.getElementById("ossUrlPill");
const ossBadge = document.getElementById("ossBadge");
const btnDownload = document.getElementById("btnDownload");
const statusMsg = document.getElementById("statusMsg");
const progressFill = document.getElementById("progressFill");

const stepParse = document.getElementById("stepParse");
const stepDownload = document.getElementById("stepDownload");
const stepUpload = document.getElementById("stepUpload");

let currentDownloadUrl = "";
let currentOssUrl = "";
let currentPreviewUrl = "";

urlInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleSubmit();
});

function resetSteps() {
  [stepParse, stepDownload, stepUpload].forEach(s => {
    s.querySelector(".step-dot").className = "step-dot";
    s.querySelector(".step-label").className = "step-label";
  });
  progressFill.style.width = "0%";
}

function setStep(el, state) {
  el.querySelector(".step-dot").className = `step-dot ${state}`;
  el.querySelector(".step-label").className = `step-label ${state}`;
}

async function handleSubmit() {
  const url = urlInput.value.trim();
  if (!url) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "处理中...";

  resetSteps();
  statusMsg.textContent = "解析链接中...";
  statusMsg.className = "status-msg";
  emptyState.style.display = "flex";
  resultContent.classList.remove("show");
  ossBadge.classList.remove("show");
  currentDownloadUrl = "";
  currentOssUrl = "";
  currentPreviewUrl = "";
  videoPlayer.src = "";

  setStep(stepParse, "active");
  statusMsg.textContent = "解析链接中...";

  try {
    const resp = await fetch("/api/parse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });

    const json = await resp.json();

    if (!json.success) {
      setStep(stepParse, "error");
      statusMsg.textContent = json.error;
      statusMsg.className = "status-msg error";
      return;
    }

    setStep(stepParse, "done");
    progressFill.style.width = "33%";

    setStep(stepDownload, "active");
    statusMsg.textContent = "下载视频中...";
    await new Promise(r => setTimeout(r, 400));
    setStep(stepDownload, "done");
    progressFill.style.width = "66%";

    setStep(stepUpload, "active");
    statusMsg.textContent = "上传至 OSS...";
    await new Promise(r => setTimeout(r, 300));

    const data = json.data;
    currentDownloadUrl = data.download_url;
    currentOssUrl = data.oss_url;
    currentPreviewUrl = data.preview_url;

    if (data.oss_url) {
      setStep(stepUpload, "done");
      progressFill.style.width = "100%";
      statusMsg.textContent = "全部完成 ✓";
      ossUrlPill.textContent = data.oss_url;
      ossUrlPill.style.display = "";
      ossBadge.classList.remove("show");
    } else {
      setStep(stepUpload, "done");
      progressFill.style.width = "100%";
      statusMsg.textContent = "完成（OSS 未配置）";
      ossUrlPill.textContent = data.download_url;
      ossUrlPill.style.display = "";
      ossBadge.classList.add("show");
    }

    emptyState.style.display = "none";
    resultContent.classList.add("show");
    videoTitle.textContent = data.title || "抖音视频";
    videoPlayer.src = currentPreviewUrl;
    videoPlayer.load();

  } catch (err) {
    statusMsg.textContent = "请求失败: " + err.message;
    statusMsg.className = "status-msg error";
    [stepParse, stepDownload, stepUpload].forEach(s => {
      if (s.querySelector(".step-dot").classList.contains("active")) {
        setStep(s, "error");
      }
    });
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "开始上传";
  }
}

function downloadVideo() {
  if (!currentDownloadUrl) return;
  const a = document.createElement("a");
  a.href = currentDownloadUrl;
  a.download = "";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function copyUrl() {
  const url = currentOssUrl || currentDownloadUrl;
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => toast("链接已复制"));
}

function copyDownloadUrl() {
  const url = currentOssUrl || currentDownloadUrl;
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => toast("链接已复制"));
}

function continueUpload() {
  urlInput.value = "";
  resetSteps();
  statusMsg.textContent = "等待输入链接...";
  statusMsg.className = "status-msg";
  emptyState.style.display = "flex";
  resultContent.classList.remove("show");
  ossBadge.classList.remove("show");
  currentDownloadUrl = "";
  currentOssUrl = "";
  currentPreviewUrl = "";
  videoPlayer.src = "";
  urlInput.focus();
}

function refreshPage() {
  location.reload();
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2300);
}
</script>
</body>
</html>
